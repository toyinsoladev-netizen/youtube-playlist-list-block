name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build plugin zip
        run: git archive --format=zip --prefix=playlist-list-block/ -o playlist-list-block.zip HEAD

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: playlist-list-block.zip
